<section class="login">
  <h2 id="login-heading">Log in</h2>

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    novalidate
    aria-labelledby="login-heading"
    [attr.aria-busy]="submitting() ? 'true' : null"
  >
    <div class="field">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="username"
        #emailInput
        [attr.aria-invalid]="email.invalid && email.touched ? 'true' : null"
        [attr.aria-describedby]="email.invalid && email.touched ? 'login-email-error' : null"
      />
      @if (email.invalid && email.touched) {
        <p class="field-error" id="login-email-error">
          <span class="field-error-icon" aria-hidden="true">&#9888;</span>
          Error: {{ emailErrorMessage() }}
        </p>
      }
    </div>

    <div class="field">
      <label for="login-password">Password</label>
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        #passwordInput
        [attr.aria-invalid]="password.invalid && password.touched ? 'true' : null"
        [attr.aria-describedby]="password.invalid && password.touched ? 'login-password-error' : null"
      />
      @if (password.invalid && password.touched) {
        <p class="field-error" id="login-password-error">
          <span class="field-error-icon" aria-hidden="true">&#9888;</span>
          Error: {{ passwordErrorMessage() }}
        </p>
      }
    </div>

    @if (loginError()) {
      <p class="field-error submit-error" id="login-error" role="alert">
        <span class="field-error-icon" aria-hidden="true">&#9888;</span>
        Error: {{ loginError() }}
      </p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>
</section>
