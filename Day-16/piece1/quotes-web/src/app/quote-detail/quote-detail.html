<section class="quote-detail">
  @switch (true) {
    @case (loading()) {
      <p class="state state-loading">Loading quote #{{ id() }}…</p>
    }
    @case (!!error()) {
      <p class="state state-error">{{ error() }}</p>
    }
    @default {
      @if (quote()) {
        <article class="quote-card">
          <blockquote>&ldquo;{{ quote()!.text }}&rdquo;</blockquote>
          <p class="author">— {{ quote()!.author }}</p>
          <dl class="meta">
            <dt>Id</dt>
            <dd>{{ quote()!.id }}</dd>
            <dt>Deleted</dt>
            <dd>{{ quote()!.isDeleted }}</dd>
          </dl>
        </article>
      } @else {
        <p class="state state-empty">No quote id was provided.</p>
      }
    }
  }
</section>
